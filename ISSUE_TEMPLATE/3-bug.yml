name: Bug
description: Something is not working as expected.
labels: ["bug"]
projects: ["chickware/1"]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      value: |
        1.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
      description: Build version, release tag, or commit SHA.
    validations:
      required: false
  - type: input
    id: environment
    attributes:
      label: Environment
      description: OS, hardware, Unity/editor version, host or client, etc.
    validations:
      required: false
  - type: textarea
    id: logs
    attributes:
      label: Logs and screenshots
      description: Paste logs as text; drag images or videos here.
    validations:
      required: false
