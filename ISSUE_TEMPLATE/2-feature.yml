name: Feature
description: A new capability or a change to existing behavior.
labels: ["enhancement"]
projects: ["chickware/1"]
body:
  - type: textarea
    id: goal
    attributes:
      label: Goal
      description: What problem does this solve, and for whom?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What should be built or changed?
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: How a reviewer can tell this is done.
      value: |
        - [ ]
    validations:
      required: true
  - type: textarea
    id: out-of-scope
    attributes:
      label: Out of scope
      description: What this explicitly does not include.
    validations:
      required: false
  - type: textarea
    id: references
    attributes:
      label: References
      description: Related issues, decisions (ADRs), design docs, mockups.
    validations:
      required: false
